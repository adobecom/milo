name: Check Pinata configuration

on:
  pull_request:
    paths:
      - '.pinata/**'
      - '.github/workflows/pinata-contract-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: node .pinata/scripts/check-contract.mjs --skip-registry
      - run: node --test .pinata/scripts/check-contract.test.mjs
