  its first class (variants follow), each table row is a child div, each cell a div inside it.
  Wrap with make-testpage.mjs:  --html this-file --foundation c2 --out tmp/perf/<block>.html
  Several blocks in one file become one section; separate sections with a closing and opening </div><div>.
-->

    </div>
    <div>
      <picture>

  </div>
</div>
