<main>
  <div class="section" style="width: 400px;">
    <div class="base-card" id="nativeControls">
      <div>
        <div>
          <h3>Native video with controls</h3>
          <p><a href="https://www.adobe.com/card-link">Learn more</a></p>
        </div>
        <div>
          <div class="video-container"><video controls muted playsinline data-video-source="https://images-tv.adobe.com/mpcv3/1/x_h264.mp4"></video></div>
        </div>
      </div>
    </div>
    <div class="base-card" id="nativeOther">
      <div>
        <div>
          <h3>Non-MPC native video</h3>
          <p><a href="https://www.adobe.com/card-link">Learn more</a></p>
        </div>
        <div>
          <div class="video-container"><video controls muted playsinline data-video-source="https://www.adobe.com/video.mp4"></video></div>
        </div>
      </div>
    </div>
    <div class="base-card" id="nativeAutoplay">
      <div>
        <div>
          <h3>Native autoplay video</h3>
          <p><a href="https://www.adobe.com/card-link">Learn more</a></p>
        </div>
        <div>
          <div class="video-container"><video autoplay muted loop playsinline></video></div>
        </div>
      </div>
    </div>
    <div class="base-card" id="mpcIframe">
      <div>
        <div>
          <h3>MPC player</h3>
          <p><a href="https://www.adobe.com/card-link">Learn more</a></p>
        </div>
        <div>
          <div class="milo-video"><iframe class="adobetv" title="MPC player"></iframe></div>
        </div>
      </div>
    </div>
    <div class="base-card" id="youtubeIframe">
      <div>
        <div>
          <h3>YouTube player</h3>
          <p><a href="https://www.adobe.com/card-link">Learn more</a></p>
        </div>
        <div>
          <div class="milo-video"><iframe title="YouTube player"></iframe></div>
        </div>
      </div>
    </div>
  </div>
</main>
