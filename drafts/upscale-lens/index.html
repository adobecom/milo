<!DOCTYPE html>
<html>
<head>
  <title>Upscale lens POC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/libs/scripts/scripts.js" type="module"></script>
  <link rel="icon" href="data:," size="any"/>
  <style>body { display: none; }</style>
</head>
<body>
  <main>
    <div>
      <div class="upscale-lens">
        <div>
          <div>
            <h1>Make low-res images sharp again.</h1>
            <p>Upscale, denoise, and sharpen your photos with AI in Adobe Firefly.</p>
            <p><strong><a href="https://firefly.adobe.com/">Try it free</a></strong></p>
          </div>
          <div><picture><img src="./before.jpg" alt="A low-resolution photo of a beetle on a leaf" width="2000" height="1205"></picture></div>
          <div><picture><img src="./after.jpg" alt="The same beetle photo, upscaled and sharp" width="2000" height="1205"></picture></div>
        </div>
      </div>
    </div>
    <div>
      <h2>One image only (CSS blur fallback)</h2>
      <div class="upscale-lens">
        <div>
          <div><picture><img src="./after.jpg" alt="A beetle on a leaf" width="2000" height="1205"></picture></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
